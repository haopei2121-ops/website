<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f6f8ff"><title>基金费率查 · 天天基金费率助手</title><style>
:root{--ink:#172033;--muted:#6c7890;--line:#e8ebf2;--blue:#465cf6;--blue2:#6b75ff;--soft:#f4f6ff;--green:#1c9a68;--shadow:0 22px 60px rgba(31,46,104,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 18% 0,#eef2ff 0,transparent 34%),#fbfcff;line-height:1.6}.shell{max-width:1120px;margin:auto;padding:28px 22px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#91a0ff);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 8px 18px #5565e550}.brand small{display:block;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:0}.source{font-size:12px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff}.hero{display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center;margin-bottom:28px}.eyebrow{color:var(--blue);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.08;letter-spacing:-.07em;margin:12px 0 18px}.hero h1 span{color:var(--blue)}.hero p{font-size:16px;color:var(--muted);max-width:520px;margin:0}.form-card{background:#fff;border:1px solid #edf0f7;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.form-card h2{font-size:18px;margin:0 0 4px}.form-card .hint{color:var(--muted);font-size:13px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin:0 0 7px}.field input{width:100%;border:1px solid #dfe4f0;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:.2s;background:#fcfdff}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #465cf615}.submit{width:100%;margin-top:16px;border:0;border-radius:12px;background:linear-gradient(110deg,var(--blue),var(--blue2));color:#fff;font-size:15px;font-weight:800;padding:14px;cursor:pointer;box-shadow:0 10px 20px #465cf52e;transition:.2s}.submit:hover{transform:translateY(-1px);box-shadow:0 13px 25px #465cf540}.submit:disabled{opacity:.7;cursor:wait;transform:none}.notice{min-height:22px;font-size:13px;color:var(--muted);margin-top:13px}.notice.error{color:#c24141}.notice.success{color:var(--green)}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 34px}.feature{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px}.feature b{display:block;font-size:14px;margin-bottom:2px}.feature span{font-size:12px;color:var(--muted)}.result{display:none}.result.show{display:block}.result-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:18px 0 14px}.result-head h2{font-size:25px;letter-spacing:-.04em;margin:0}.result-head p{font-size:13px;color:var(--muted);margin:4px 0 0}.copy{border:1px solid #d8ddff;background:var(--soft);color:var(--blue);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer;white-space:nowrap}.copy.done{background:#e9fbf3;color:var(--green);border-color:#c7f0dc}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rate-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #1f2e680a}.rate-top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:2px}.rate-top strong{font-size:18px}.tag{font-size:12px;font-weight:800;border-radius:999px;padding:5px 9px;background:#edf0ff;color:var(--blue)}.rate-row{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid #f0f2f7;font-size:14px}.rate-row:last-child{border:0}.rate-row span{color:var(--muted)}.rate-row b{font-size:15px}.rate-row b.na{color:#9aa4b5;font-weight:600}.intro{margin-top:16px;background:linear-gradient(135deg,#f5f7ff,#fff);border:1px solid #e8ebff;border-radius:18px;padding:20px 22px}.intro-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.intro h3{font-size:15px;margin:0}.intro p{font-size:14px;line-height:1.9;margin:0;color:#3a465b}.foot{text-align:center;color:#9aa4b5;font-size:12px;margin-top:48px}.loading{display:inline-flex;align-items:center;gap:8px}.dot{width:14px;height:14px;border:2px solid #cbd2ff;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:780px){.shell{padding:20px 16px 42px}.topbar{margin-bottom:28px}.source{display:none}.hero{grid-template-columns:1fr;gap:24px}.hero h1{font-size:43px}.features{grid-template-columns:1fr 1fr}.feature:last-child{display:none}.cards{grid-template-columns:1fr}.result-head{align-items:start;flex-direction:column}.copy{width:100%}}@media(max-width:420px){.fields{grid-template-columns:1fr}.hero h1{font-size:38px}}
</style></head><body><main class="shell"><nav class="topbar"><div class="brand"><div class="brand-mark">率</div><div>基金费率查<small>FUND FEE LENS</small></div></div><div class="source">数据源 · 天天基金</div></nav><section class="hero"><div><div class="eyebrow">Fund fee lens</div><h1>看懂基金费率，<br><span>只需要两个代码。</span></h1><p>输入同一基金的 A 类与 C 类份额代码，快速整理原始费率，生成一段可以直接转发的费率说明。</p></div><form class="form-card" id="queryForm"><h2>查询份额费率</h2><p class="hint">请输入 6 位基金代码，展示未打折费率</p><div class="fields"><div class="field"><label for="aCode">A 类份额代码</label><input id="aCode" inputmode="numeric" maxlength="6" placeholder="例如 000001" required></div><div class="field"><label for="cCode">C 类份额代码</label><input id="cCode" inputmode="numeric" maxlength="6" placeholder="例如 000002" required></div></div><button class="submit" id="submitBtn" type="submit">查询费率 <span>→</span></button><div class="notice" id="notice"></div></form></section><section class="features"><div class="feature"><b>原始费率</b><span>不展示天天基金折扣价</span></div><div class="feature"><b>A / C 对比</b><span>申购、赎回、销售服务费</span></div><div class="feature"><b>一键复制</b><span>自动生成介绍文字</span></div></section><section class="result" id="result"><div class="result-head"><div><h2>费率结果</h2><p id="resultMeta">已根据最新可获取的公开信息整理</p></div><button class="copy" id="copyBtn" type="button">复制费率介绍</button></div><div class="cards" id="cards"></div><div class="intro"><div class="intro-head"><h3>可直接使用的介绍文字</h3><span class="tag">已生成</span></div><p id="introText"></p></div></section><div class="foot">费率信息仅供参考，具体以基金管理人及销售机构公告为准 · 本工具不构成投资建议</div></main><script>
const $=id=>document.getElementById(id),demo={name:'暂未读取到基金名称',buy:'—',redeem:'—',service:'—',source:'占位结果'};function cleanCode(v){return(v||'').replace(/\D/g,'').slice(0,6)}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pick(text,labels){for(const label of labels){const r=new RegExp(label+'[^\\d%]{0,80}(\\d+(?:\\.\\d+)?\\s*%)','i').exec(text);if(r)return r[1].replace(/\s/g,'')}return '—'}
async function fetchFund(code){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),12000);try{const res=await fetch('/api/fund?code='+encodeURIComponent(code),{signal:ctl.signal});if(!res.ok)throw Error('network');const data=await res.json();if(!data.ok)throw Error(data.error||'notfound');return data.fund;}finally{clearTimeout(timer)}}function card(f,type){return`<article class="rate-card"><div class="rate-top"><strong>${esc(f.name)}</strong><span class="tag">${type} 类 · ${esc(f.code)}</span></div><div class="rate-row"><span>申购费</span><b class="${f.buy==='—'?'na':''}">${esc(f.buy)}</b></div><div class="rate-row"><span>赎回费</span><b class="${f.redeem==='—'?'na':''}">${esc(f.redeem)}</b></div><div class="rate-row"><span>销售服务费</span><b class="${f.service==='—'?'na':''}">${esc(f.service)}</b></div></article>`}function intro(a,c){return`基金费率对比：${a.name}（A类，代码${a.code}）申购费${a.buy}、赎回费${a.redeem}、销售服务费${a.service}；${c.name}（C类，代码${c.code}）申购费${c.buy}、赎回费${c.redeem}、销售服务费${c.service}。以上均为未打折费率，实际交易费用请以基金管理人及销售机构最新公告为准。`}
$('queryForm').addEventListener('submit',async e=>{e.preventDefault();const aCode=cleanCode($('aCode').value),cCode=cleanCode($('cCode').value);if(aCode.length!==6||cCode.length!==6){$('notice').className='notice error';$('notice').textContent='请输入完整的 6 位基金代码';return}const btn=$('submitBtn');btn.disabled=true;btn.innerHTML='<span class="loading"><i class="dot"></i>正在查询…</span>';$('notice').className='notice';$('notice').textContent='正在读取公开费率信息';let a,c;try{[a,c]=await Promise.all([fetchFund(aCode),fetchFund(cCode)]);$('notice').className='notice success';$('notice').textContent='查询完成 · 已整理未打折费率'}catch(err){a={...demo,code:aCode,name:'A 类份额（暂未读取到名称）'};c={...demo,code:cCode,name:'C 类份额（暂未读取到名称）'};$('notice').className='notice error';$('notice').textContent='暂时无法读取天天基金页面，已展示占位结果，请稍后重试'}$('cards').innerHTML=card(a,'A')+card(c,'C');$('introText').textContent=intro(a,c);$('resultMeta').textContent=`${a.source==='天天基金公开数据'?'数据已从天天基金公开页面整理':'请注意：当前为占位结果'} · 查询代码 ${aCode} / ${cCode}`;$('result').classList.add('show');$('result').scrollIntoView({behavior:'smooth',block:'start'});btn.disabled=false;btn.innerHTML='查询费率 <span>→</span>'});$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('introText').textContent);$('copyBtn').textContent='已复制 ✓';$('copyBtn').classList.add('done');setTimeout(()=>{$('copyBtn').textContent='复制费率介绍';$('copyBtn').classList.remove('done')},1800)}catch{$('notice').className='notice error';$('notice').textContent='复制失败，请手动选择文字复制'}});['aCode','cCode'].forEach(id=>$(id).addEventListener('input',e=>e.target.value=cleanCode(e.target.value)));
</script></body></html>
